name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend & PostgreSQL 15 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: campus_ci
          POSTGRES_PASSWORD: campus_ci_secret
          POSTGRES_DB: project_campus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_ci -d project_campus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-testing-high-entropy-secret-key-minimum-32-chars-2026
      DATABASE_URL: postgresql+asyncpg://campus_ci:campus_ci_secret@localhost:5432/project_campus_ci
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://campus_ci:campus_ci_secret@localhost:5432/project_campus_ci
      PYTHONPATH: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Apply Alembic migrations to fresh PostgreSQL 15 database
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Verify migration head matches repository head (0cbebed2ada2)
        run: |
          CURRENT_HEAD=$(python -m alembic -c backend/alembic.ini current | grep -o "0cbebed2ada2" || true)
          if [ "$CURRENT_HEAD" != "0cbebed2ada2" ]; then
            echo "ERROR: Migration head did not match expected revision 0cbebed2ada2"
            python -m alembic -c backend/alembic.ini current
            exit 1
          fi
          echo "Verified Alembic revision head is 0cbebed2ada2."

      - name: Run PostgreSQL integration tests
        run: |
          pytest tests/test_postgresql_integration.py -v | tee pg_test_output.log
          if grep -q "skipped" pg_test_output.log; then
            echo "ERROR: PostgreSQL integration tests were skipped unexpectedly in CI!"
            exit 1
          fi
          echo "All PostgreSQL integration tests executed and passed without skips."

      - name: Run full backend test suite
        run: |
          pytest tests/ -v

  frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
