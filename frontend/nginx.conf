# ==============================================================================
# Upstream TLS Ingress Trust Boundary & Forwarded-Protocol Normalization
# ==============================================================================
# 1. Determine whether the immediate connecting peer is a trusted ingress/proxy.
#    Trusts RFC 1918 private subnets and loopback (matches backend FORWARDED_ALLOW_IPS).
geo $remote_addr $is_trusted_ingress {
    default 0;
    127.0.0.1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

# 2. Strict whitelist of allowed X-Forwarded-Proto values.
#    Only canonical "https" and "http" values are accepted; malformed/arbitrary values are discarded.
map $http_x_forwarded_proto $sanitized_proto {
    "https" https;
    "http"  http;
    default "";
}

# 3. Securely determine the protocol communicated to the backend.
#    Only preserve $sanitized_proto if the immediate peer is a trusted ingress ($is_trusted_ingress = 1).
#    Direct or untrusted connections ($is_trusted_ingress = 0) and missing headers fall back to $scheme (http),
#    preventing external clients from spoofing HTTPS over an unencrypted connection.
map "$is_trusted_ingress:$sanitized_proto" $forwarded_proto {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

# 4. Conditionally emit HSTS strictly when the request originated over HTTPS.
#    RFC 6797 Section 7.2 prohibits sending HSTS over insecure HTTP transport.
#    Omits broad subdomain rules and browser list inclusions to prevent inadvertent breakage of sibling domains.
map $forwarded_proto $hsts_header {
    "https" "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;

    # Gzip compression for production performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Reverse proxy API requests to backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse proxy health check to backend service
    location /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Cache static bundled assets indefinitely (content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # SPA fallback routing: serve index.html for all non-asset paths with no-cache revalidation
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
    }
}
